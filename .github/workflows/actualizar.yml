name: Actualizar partidos

on:
  schedule:
    - cron: "7,37 * * * *"   # cada 30 min
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recuperar los datos publicados (se conservan si un deporte falla)
        run: |
          for s in futbol baloncesto tenis motos coches; do
            curl -sf -o site/data-$s.json https://boletusc.github.io/partidos-tv/data-$s.json || rm -f site/data-$s.json
          done
      - name: Descargar partidos
        run: python scraper.py site
      - name: Mantener vivo el cron (GitHub lo pausa tras 60 días sin commits)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%FT%TZ > .keepalive
            git add .keepalive && git commit -m "keepalive" && git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
